name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: ${{ vars.AWS_REGION }}

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Get image tag from CI run
        id: meta
        run: |
          echo "tag=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name chesslink

      - name: Install Helm
        run: |
          curl -fsSL -o get_helm.sh https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3
          chmod 700 get_helm.sh
          ./get_helm.sh

      # -----------------------------------------------------------------------
      # Deploy with Helm
      # -----------------------------------------------------------------------
      - name: Deploy with Helm
        run: |
          TAG=${{ steps.meta.outputs.tag }}

          helm upgrade --install chesslink helm/chesslink \
            --namespace chesslink \
            --create-namespace \
            --values helm/chesslink/values.aws.yaml \
            --set backend.image.tag="${TAG}" \
            --set frontend.image.tag="${TAG}" \
            --wait \
            --timeout 5m

          echo "Deployed image tag: ${TAG}"

      - name: Print app status
        run: kubectl get pods -n chesslink