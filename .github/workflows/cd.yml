name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: ${{ vars.AWS_REGION }}

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Get image tag from CI run
        id: meta
        run: |
          echo "tag=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name chesslink

      - name: Install Helm
        run: |
          curl -fsSL -o get_helm.sh https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3
          chmod 700 get_helm.sh
          ./get_helm.sh

      # -----------------------------------------------------------------------
      # Deploy with Helm
      # -----------------------------------------------------------------------
      - name: Reset stuck Helm release
        run: |
          STATUS=$(helm status chesslink -n chesslink -o json 2>/dev/null | python3 -c "import sys,json; print(json.load(sys.stdin)['info']['status'])" 2>/dev/null || echo "not-found")
          echo "Current Helm status: $STATUS"
          if [ "$STATUS" = "pending-upgrade" ] || [ "$STATUS" = "pending-install" ] || [ "$STATUS" = "pending-rollback" ]; then
            echo "Releasing stuck lock..."
            helm rollback chesslink -n chesslink || helm uninstall chesslink -n chesslink || true
          fi
            
      - name: Deploy with Helm
        id: helm_deploy
        continue-on-error: true
        run: |
          TAG=${{ steps.meta.outputs.tag }}

          helm upgrade --install chesslink helm/chesslink \
            --namespace chesslink \
            --create-namespace \
            --values helm/chesslink/values.aws.yaml \
            --set backend.image.tag="${TAG}" \
            --set frontend.image.tag="${TAG}" \
            --wait \
            --timeout 5m

          echo "Deployed image tag: ${TAG}"

      # -----------------------------------------------------------------------
      # print diagnostics
      # -----------------------------------------------------------------------
      - name: Diagnostics
        if: always()
        run: |
          echo "=== Frontend logs ==="
          kubectl logs -n chesslink -l app=chesslink-frontend --previous 2>/dev/null || \
          kubectl logs -n chesslink -l app=chesslink-frontend 2>/dev/null || true
          
          echo "=== Pods ==="
          kubectl get pods -n chesslink -o wide

          echo "=== Events (last 30) ==="
          kubectl get events -n chesslink --sort-by='.lastTimestamp' | tail -30

          echo "=== Describe non-Running pods ==="
          kubectl get pods -n chesslink --no-headers \
            | grep -v " Running " \
            | awk '{print $1}' \
            | xargs -r -I{} kubectl describe pod {} -n chesslink

          echo "=== Helm status ==="
          helm status chesslink -n chesslink || true

      - name: Fail if deploy failed
        if: steps.helm_deploy.outcome == 'failure'
        run: exit 1