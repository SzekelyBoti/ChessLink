name: Infrastructure

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Terraform action to run"
        required: true
        type: choice
        options:
          - apply
          - destroy

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  TF_WORKING_DIR: terraform/aws
  STATE_BUCKET: chesslink-tfstate-${{ vars.AWS_ACCOUNT_ID }}

jobs:
  terraform:
    name: Terraform ${{ github.event.inputs.action }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"

      - name: Create S3 state bucket if not exists
        run: |
          if aws s3api head-bucket --bucket ${{ env.STATE_BUCKET }} 2>/dev/null; then
            echo "✅ State bucket already exists"
          else
            echo "Creating state bucket ${{ env.STATE_BUCKET }}..."
            aws s3api create-bucket \
              --bucket ${{ env.STATE_BUCKET }} \
              --region ${{ env.AWS_REGION }} \
              --create-bucket-configuration LocationConstraint=${{ env.AWS_REGION }}

            # Enable versioning so we can recover from bad state
            aws s3api put-bucket-versioning \
              --bucket ${{ env.STATE_BUCKET }} \
              --versioning-configuration Status=Enabled

            # Block all public access
            aws s3api put-public-access-block \
              --bucket ${{ env.STATE_BUCKET }} \
              --public-access-block-configuration \
                BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true

            echo "✅ State bucket created"
          fi

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init

      - name: Import existing resources if present
        if: github.event.inputs.action == 'apply'
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          CLUSTER_NAME: chesslink
          ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
        run: |
          import_if_missing() {
            local resource=$1
            local id=$2
            if terraform state show "$resource" &>/dev/null; then
              echo "✅ $resource already in state, skipping"
            else
              echo "⬇️  Importing $resource..."
              terraform import \
                -var="github_org=${{ vars.GH_ORG }}" \
                -var="github_repo=${{ vars.GH_REPO }}" \
                "$resource" "$id" || echo "⚠️  $resource not found in AWS, will be created"
            fi
          }

          import_if_missing 'aws_ecr_repository.services["backend"]'  "${CLUSTER_NAME}/backend"
          import_if_missing 'aws_ecr_repository.services["frontend"]' "${CLUSTER_NAME}/frontend"
          import_if_missing "aws_iam_role.eks_cluster"                 "${CLUSTER_NAME}-eks-cluster-role"
          import_if_missing "aws_iam_role.eks_node"                    "${CLUSTER_NAME}-eks-node-role"
          import_if_missing "aws_iam_role.github_actions"              "${CLUSTER_NAME}-github-actions-role"
          import_if_missing "aws_iam_role.ebs_csi"                     "${CLUSTER_NAME}-ebs-csi-role"
          import_if_missing "aws_iam_openid_connect_provider.github"   "arn:aws:iam::${ACCOUNT_ID}:oidc-provider/token.actions.githubusercontent.com"
          import_if_missing "aws_cloudwatch_log_group.eks"             "/aws/eks/${CLUSTER_NAME}/cluster"

      - name: Terraform Plan
        if: github.event.inputs.action == 'apply'
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform plan \
            -var="github_org=${{ vars.GH_ORG }}" \
            -var="github_repo=${{ vars.GH_REPO }}"

      - name: Terraform Apply
        if: github.event.inputs.action == 'apply'
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform apply -auto-approve \
            -var="github_org=${{ vars.GH_ORG }}" \
            -var="github_repo=${{ vars.GH_REPO }}"

      - name: Terraform Destroy
        if: github.event.inputs.action == 'destroy'
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform destroy -auto-approve \
            -var="github_org=${{ vars.GH_ORG }}" \
            -var="github_repo=${{ vars.GH_REPO }}"

      - name: Trigger CD workflow
        if: github.event.inputs.action == 'apply'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GH_PAT }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'cd.yml',
              ref: 'main'
            })
            console.log('CD workflow triggered')