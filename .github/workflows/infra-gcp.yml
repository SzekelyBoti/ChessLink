name: Infrastructure (GCP)

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Terraform action to run"
        required: true
        type: choice
        options:
          - apply
          - destroy

env:
  TF_WORKING_DIR: terraform/gcp
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: europe-north1

jobs:
  terraform:
    name: Terraform ${{ github.event.inputs.action }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"

      # -----------------------------------------------------------------------
      # Create GCS state bucket if it doesn't exist
      # -----------------------------------------------------------------------
      - name: Create GCS state bucket if not exists
        run: |
          BUCKET="chesslink-tfstate"
          if gcloud storage buckets describe gs://${BUCKET} &>/dev/null; then
            echo "✅ State bucket already exists"
          else
            echo "Creating state bucket..."
            gcloud storage buckets create gs://${BUCKET} \
              --project=${{ vars.GCP_PROJECT_ID }} \
              --location=europe-north1
            gcloud storage buckets update gs://${BUCKET} --versioning
            echo "✅ Bucket created"
          fi

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init

      - name: Terraform Plan
        if: github.event.inputs.action == 'apply'
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform plan

      - name: Terraform Apply
        if: github.event.inputs.action == 'apply'
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform apply -auto-approve

      - name: Terraform Destroy
        if: github.event.inputs.action == 'destroy'
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform destroy -auto-approve

      # -----------------------------------------------------------------------
      # Print outputs after apply — these go into GitHub secrets
      # -----------------------------------------------------------------------
      - name: Print outputs
        if: github.event.inputs.action == 'apply'
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          echo "=== Add these as GitHub secrets ==="
          terraform output workload_identity_provider
          terraform output service_account_email
          terraform output artifact_registry_url
