apiVersion: apps/v1
kind: Deployment
metadata:
  name: chesslink-frontend
  namespace: chesslink
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chesslink-frontend
  template:
    metadata:
      labels:
        app: chesslink-frontend
    spec:
      containers:
        - name: frontend
          image: chesslink/frontend:local
          imagePullPolicy: Never
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: chesslink-frontend
  namespace: chesslink
spec:
  type: NodePort
  selector:
    app: chesslink-frontend
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080