apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: chesslink
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: chesslink/backend:local
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          env:
            - name: ENVIRONMENT
              value: development
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: "8000"
            - name: LOG_LEVEL
              value: DEBUG
            - name: USE_MEMORY_DB
              value: "false"
            - name: MONGODB_URI
              value: mongodb://mongodb:27017/chesslink
            - name: ALLOWED_ORIGINS
              value: "http://localhost,http://localhost:80,http://localhost:3000"
            - name: WS_PING_INTERVAL
              value: "25"
            - name: WS_CONNECTION_TIMEOUT
              value: "60"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: chesslink
spec:
  type: ClusterIP
  selector:
    app: backend
  ports:
    - port: 8000
      targetPort: 8000