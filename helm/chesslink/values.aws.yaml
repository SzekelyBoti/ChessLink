global:
  environment: production
  imagePullPolicy: Always

# ---------------------------------------------------------------------------
# Backend
# ---------------------------------------------------------------------------
backend:
  replicaCount: 2
  image:
    repository: "029517664698.dkr.ecr.eu-north-1.amazonaws.com/chesslink/backend"
    tag: "d946df5"
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  env:
    ENVIRONMENT: production
    HOST: "0.0.0.0"
    PORT: "8000"
    LOG_LEVEL: INFO
    WS_PING_INTERVAL: "30"
    WS_CONNECTION_TIMEOUT: "60"
    WS_MAX_MESSAGE_SIZE: "1024"
    USE_MEMORY_DB: "false"
    MONGODB_URI: "mongodb://mongodb:27017/chesslink"
    ALLOWED_ORIGINS: "http://localhost,http://localhost:80"
  service:
    type: ClusterIP
    port: 8000
  readinessProbe:
    httpGet:
      path: /ready
      port: 8000
    initialDelaySeconds: 10
    periodSeconds: 5
    failureThreshold: 3
  livenessProbe:
    httpGet:
      path: /health
      port: 8000
    initialDelaySeconds: 30
    periodSeconds: 10
    failureThreshold: 3

# ---------------------------------------------------------------------------
# Frontend
# ---------------------------------------------------------------------------
frontend:
  replicaCount: 2
  image:
    repository: "029517664698.dkr.ecr.eu-north-1.amazonaws.com/chesslink/frontend"
    tag: "d946df5"
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
  service:
    type: ClusterIP
    port: 80
  readinessProbe:
    httpGet:
      path: /
      port: 80
    initialDelaySeconds: 5
    periodSeconds: 5
    failureThreshold: 3
  livenessProbe:
    httpGet:
      path: /
      port: 80
    initialDelaySeconds: 10
    periodSeconds: 10
    failureThreshold: 3

# ---------------------------------------------------------------------------
# MongoDB - DISABLE PERSISTENCE FOR FIRST DEPLOYMENT
# ---------------------------------------------------------------------------
mongodb:
  replicaCount: 1
  image:
    repository: mongo
    tag: "6.0"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  service:
    type: ClusterIP
    port: 27017
  persistence:
    enabled: false
    size: 5Gi
    storageClass: ""
  livenessProbe:
    exec:
      command:
        - mongosh
        - "--eval"
        - "db.adminCommand('ping')"
    initialDelaySeconds: 30
    periodSeconds: 10
    failureThreshold: 3

# ---------------------------------------------------------------------------
# Ingress - DISABLE UNTIL YOU HAVE A DOMAIN
# ---------------------------------------------------------------------------
ingress:
  enabled: false
  className: alb
  host: "chess-link.com"
  tls:
    enabled: false
    secretName: ""
  annotations: {}

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70 