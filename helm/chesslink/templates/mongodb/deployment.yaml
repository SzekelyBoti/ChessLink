apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb
  namespace: chesslink
  labels:
    {{- include "chesslink.mongodb.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "chesslink.mongodb.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "chesslink.mongodb.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: mongodb
          image: "{{ .Values.mongodb.image.repository }}:{{ .Values.mongodb.image.tag }}"
          imagePullPolicy: {{ .Values.mongodb.image.pullPolicy }}
          ports:
            - name: mongodb
              containerPort: 27017
              protocol: TCP
          env:
            - name: MONGO_INITDB_DATABASE
              value: chesslink
          livenessProbe:
            {{- toYaml .Values.mongodb.livenessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.mongodb.resources | nindent 12 }}