apiVersion: v1
kind: Service
metadata:
  name: {{ include "chesslink.fullname" . }}-backend
  namespace: chesslink
  labels:
    {{- include "chesslink.backend.labels" . | nindent 4 }}
spec:
  type: {{ .Values.backend.service.type }}
  selector:
    {{- include "chesslink.backend.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.backend.service.port }}
      targetPort: http
      protocol: TCP