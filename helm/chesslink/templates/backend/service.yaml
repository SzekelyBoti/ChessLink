apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.app.name }}-backend
  namespace: {{ .Values.namespace.default }}
spec:
  type: {{ .Values.backend.serviceType }}
  selector:
    app: {{ .Values.app.name }}-backend
  ports:
      - port: {{ .Values.backend.port }}
        targetPort: {{ .Values.backend.port }}