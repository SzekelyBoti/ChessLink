apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.app.name }}-frontend
  namespace: {{ .Values.namespace.default }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Values.app.name }}-frontend
  template:
    metadata:
      labels:
        app: {{ .Values.app.name }}-frontend
    spec:
      containers:
          - name: frontend
            image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag }}"
            ports:
              - containerPort: {{ .Values.frontend.port }}