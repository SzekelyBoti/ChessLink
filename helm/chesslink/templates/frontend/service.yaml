apiVersion: v1
kind: Service
metadata:
  name: {{ include "chesslink.fullname" . }}-frontend
  namespace: chesslink
  labels:
    {{- include "chesslink.frontend.labels" . | nindent 4 }}
spec:
  type: {{ .Values.frontend.service.type }}
  selector:
    {{- include "chesslink.frontend.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.frontend.service.port }}
      targetPort: http
      protocol: TCP